<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Moe!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a2a3a 0%, #050505 100%);
            font-family: 'Poppins', sans-serif;
            color: #fff;
            overflow: hidden;
            touch-action: manipulation;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 40px 25px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            /* Important for layering sparkles */
            position: relative; 
            z-index: 10;
        }

        .image-container {
            width: 160px;
            height: 160px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            background: #222;
            position: relative;
            z-index: 11; /* Lower than sparkles, higher than background */
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 10px 0;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text; /* Added for standard compatibility */
            position: relative;
            z-index: 11;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ddd;
            margin-bottom: 25px;
            position: relative;
            z-index: 11;
        }

        .celebrate-btn {
            background: linear-gradient(45deg, #d4af37, #f2d06b);
            color: #000;
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            z-index: 12; /* Ensure button is clickable over everything */
            box-shadow: 0 8px 15px rgba(212, 175, 55, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        /* Fixed Sparkle Styling */
        .sparkle {
            position: absolute;
            pointer-events: none;
            z-index: 999; /* Higher than ALL other content */
            border-radius: 50%;
            animation: moveUpAndSpread 2.5s ease-out forwards;
        }

        /* Improved Animation Path */
        @keyframes moveUpAndSpread {
            0% { 
                transform: translateY(0) scale(0) rotate(0deg); 
                opacity: 0; 
            }
            10% {
                transform: translateY(-20px) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% { 
                /* Move far above the top of the card and spread widely */
                transform: translateY(-500px) scale(0) rotate(180deg); 
                opacity: 0; 
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="image-container">
            <img src="https://papiphotos.remax-im.com/Person/100907376/MainPhoto_cropped/MainPhoto_cropped.jpg" 
                 alt="Moe" 
                 class="profile-pic"
                 onerror="this.src='https://ui-avatars.com/api/?name=Moe+Asgarian&background=d4af37&color=fff&size=256'">
        </div>
        
        <h1>Happy Birthday Moe Asgarian!</h1>
        <p>Wishing you a spectacular day filled with success, happiness, and everything you've been working toward.</p>
        
        <button class="celebrate-btn" onclick="fire()" ontouchstart="fire()">Celebrate 🥂</button>
    </div>

    <script>
        function fire() {
            // Reduced count for better performance/look
            const colors = ['#d4af37', '#ffffff', '#f2d06b'];
            // Place sparkles inside the card instead of the body
            const card = document.querySelector('.main-card');
            
            for (let i = 0; i < 25; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                const size = Math.random() * 8 + 4 + 'px';
                sparkle.style.width = size;
                sparkle.style.height = size;
                
                // Position initial spawn point near the button inside the card
                sparkle.style.bottom = '60px'; // Approx button height
                sparkle.style.left = (Math.random() * 80 + 10) + '%'; // Spread across card width
                
                sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                sparkle.style.boxShadow = `0 0 10px ${sparkle.style.backgroundColor}`;
                
                // Randomize speed and start delay
                sparkle.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
                sparkle.style.animationDelay = (Math.random() * 0.2) + 's';

                card.appendChild(sparkle);
                
                // Keep cleanup timeout slightly longer than max animation time
                setTimeout(() => sparkle.remove(), 3500);
            }
        }
    </script>
</body>
</html>
